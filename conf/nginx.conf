
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  100000;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name  localhost;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

    server {
       listen 443 ssl;
       server_name zh.wikipedia.org;
       server_name zh-yue.wikipedia.org;
       server_name wuu.wikipedia.org;
       server_name ug.wikipedia.org;
       server_name ja.wikipedia.org;
       server_name zh.wikinews.org;
       server_name zh.m.wikipedia.org;
       server_name ug.m.wikipedia.org;
       server_name zh.m.wikinews.org;
       server_name zh.m.wikibooks.org;
       server_name zh.wikisource.org;
       ssl_certificate proxy.crt;
       ssl_certificate_key proxy.key;
   	location / {
           proxy_pass https://208.80.153.224/;
           proxy_set_header Host $http_host;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Real_IP $remote_addr;
           proxy_set_header User-Agent $http_user_agent;
           proxy_set_header Accept-Encoding ''; 
           proxy_buffer_size 16k;
           proxy_buffers 8 16k;
           proxy_busy_buffers_size 32k;
           proxy_buffering off;
       }
       }

    server {
       listen 443 ssl;
       server_name github.com;
       ssl_certificate proxy.crt;
       ssl_certificate_key proxy.key;

       location / {
           proxy_pass https://github.com;
           proxy_ssl_server_name on;
           proxy_ssl_name $host;
           proxy_set_header Host $host;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header User-Agent $http_user_agent;
           proxy_set_header Accept-Encoding '';
           proxy_buffer_size 16k;
           proxy_buffers 8 16k;
           proxy_busy_buffers_size 32k;
           proxy_buffering off;
       }
    }

    server {
       listen 443 ssl;
       server_name catbox.moe;
       ssl_certificate proxy.crt;
       ssl_certificate_key proxy.key;

       location / {
           proxy_pass https://catbox.moe;
           proxy_http_version 1.1;
           proxy_ssl_server_name on;
           proxy_ssl_name $host;
           proxy_set_header Host $host;
           proxy_set_header Connection '';
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header User-Agent $http_user_agent;
           proxy_set_header Accept-Encoding '';
           client_max_body_size 0;
           proxy_request_buffering off;
           proxy_buffer_size 16k;
           proxy_buffers 8 16k;
           proxy_busy_buffers_size 32k;
           proxy_buffering off;
       }
    }

    server {
       listen 443 ssl;
       server_name files.catbox.moe;
       ssl_certificate proxy.crt;
       ssl_certificate_key proxy.key;

       location / {
           proxy_pass https://files.catbox.moe;
           proxy_http_version 1.1;
           proxy_ssl_server_name on;
           proxy_ssl_name $host;
           proxy_set_header Host $host;
           proxy_set_header Connection '';
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header User-Agent $http_user_agent;
           proxy_set_header Accept-Encoding '';
           client_max_body_size 0;
           proxy_request_buffering off;
           proxy_buffer_size 16k;
           proxy_buffers 8 16k;
           proxy_busy_buffers_size 32k;
           proxy_buffering off;
       }
    }

